<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Languages — InterviewAI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header id="topbar"></header>

      <main class="page-body">
        
        <div style="margin-bottom: 2rem;">
          <div style="display:inline-flex; align-items:center; gap:0.4rem; background:var(--color-primary-light); color:var(--color-primary); padding:0.25rem 0.75rem; border-radius:9999px; font-size:0.75rem; font-weight:700; margin-bottom:0.5rem;">
            <i data-lucide="terminal" style="width:14px;height:14px;"></i> PLACEMENT CORE LANGUAGES
          </div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Programming Languages Deep Dive</h1>
          <p style="color: var(--color-text-muted);">
            Master language-specific memory models, execution engines, OOP nuances, and tricky interview programs across Java, Python, C++, and SQL.
          </p>
        </div>

        <!-- Language Selector Tabs -->
        <div style="display:flex; gap:0.5rem; margin-bottom:1.75rem; flex-wrap:wrap;" id="languageTabsContainer"></div>

        <!-- Active Language Detail Container -->
        <div id="activeLanguageContainer">
          <div style="text-align:center; padding:3rem; color:var(--color-text-subtle);">
            Loading language curricula...
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    let allLanguages = [];
    let selectedLangId = 'java';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await auth.requireAuth();
      if (!user) return;
      loadLanguages();
    });

    async function loadLanguages() {
      const container = document.getElementById('activeLanguageContainer');
      const tabs = document.getElementById('languageTabsContainer');
      try {
        allLanguages = await api.get('/learning/languages');
        if (!allLanguages || allLanguages.length === 0) {
          container.innerHTML = `<div style="text-align:center;padding:2rem;">No language curricula found.</div>`;
          return;
        }

        // Render tabs
        tabs.innerHTML = allLanguages.map(l => `
          <button type="button" class="btn btn-sm ${l.id === selectedLangId ? 'btn-primary' : 'btn-secondary'} lang-tab-btn" data-id="${l.id}">
            <i data-lucide="${l.icon}" style="width:14px;height:14px;"></i> ${escapeHtml(l.name)}
          </button>
        `).join('');

        tabs.querySelectorAll('.lang-tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedLangId = btn.dataset.id;
            tabs.querySelectorAll('.lang-tab-btn').forEach(b => {
              b.classList.remove('btn-primary');
              b.classList.add('btn-secondary');
            });
            btn.classList.add('btn-primary');
            btn.classList.remove('btn-secondary');
            renderActiveLanguage();
          });
        });

        renderActiveLanguage();
      } catch (err) {
        console.error('Failed to load languages:', err);
        container.innerHTML = `<div style="text-align:center;padding:2rem;color:#ef4444;">Failed to load language curricula.</div>`;
      }
    }

    function renderActiveLanguage() {
      const lang = allLanguages.find(l => l.id === selectedLangId) || allLanguages[0];
      const container = document.getElementById('activeLanguageContainer');
      if (!lang) return;

      let levelsHtml = lang.levels.map(lvl => `
        <div class="card" style="padding:1.5rem; margin-bottom:1.25rem;">
          <h4 style="font-size:1.1rem; color:var(--color-primary); margin-bottom:0.75rem;">
            ${escapeHtml(lvl.name)} Milestones
          </h4>
          <div style="display:flex; flex-wrap:wrap; gap:0.5rem;">
            ${lvl.topics.map(t => `<span class="badge badge-neutral" style="font-size:0.8125rem; padding:0.4rem 0.75rem;">${escapeHtml(t)}</span>`).join('')}
          </div>
        </div>
      `).join('');

      let questionsHtml = lang.common_interview_questions.map((q, idx) => `
        <div style="padding:1rem; background:var(--color-bg-page); border:1px solid var(--color-border); border-radius:var(--radius-md); margin-bottom:0.75rem;">
          <div style="font-weight:700; color:var(--color-text-main); font-size:0.9375rem;">
            Q${idx + 1}: ${escapeHtml(q)}
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="card" style="padding:2rem; margin-bottom:1.75rem; border-left:4px solid var(--color-primary);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <div>
              <h2 style="font-size:1.75rem; margin-bottom:0.25rem;">${escapeHtml(lang.name)} Placement Curriculum</h2>
              <p style="color:var(--color-text-muted); font-size:0.9375rem;">${escapeHtml(lang.tagline)}</p>
            </div>
            <a href="coding.html" class="btn btn-outline btn-sm">
              <i data-lucide="code-2" style="width:14px;height:14px;"></i> Practice ${escapeHtml(lang.name)} Problems
            </a>
          </div>
        </div>

        <h3 style="font-size:1.25rem; margin-bottom:1rem;">Learning Stages & Syllabus</h3>
        ${levelsHtml}

        <div class="card" style="padding:1.75rem; margin-top:1.5rem;">
          <h3 style="font-size:1.25rem; margin-bottom:0.5rem;">Top Recruiter Interview Questions (${escapeHtml(lang.name)})</h3>
          <p style="color:var(--color-text-muted); font-size:0.875rem; margin-bottom:1.25rem;">Questions frequently asked during campus hiring technical rounds.</p>
          ${questionsHtml}
        </div>
      `;

      if (window.lucide) lucide.createIcons();
    }
  </script>
</body>
</html>
