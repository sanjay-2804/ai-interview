<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Design Studio — InterviewAI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header id="topbar"></header>

      <main class="page-body">
        
        <div style="margin-bottom: 2rem;">
          <div style="display:inline-flex; align-items:center; gap:0.4rem; background:var(--color-primary-light); color:var(--color-primary); padding:0.25rem 0.75rem; border-radius:9999px; font-size:0.75rem; font-weight:700; margin-bottom:0.5rem;">
            <i data-lucide="network" style="width:14px;height:14px;"></i> SYSTEM ARCHITECTURE & SCALABILITY
          </div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">System Design Learning Studio</h1>
          <p style="color: var(--color-text-muted);">
            Guided blueprints of real-world distributed architectures: TinyURL, Real-time Chat, Ride Hailing, and Distributed Caching.
          </p>
        </div>

        <div id="systemDesignContainer" style="display:flex; flex-direction:column; gap:1.75rem; margin-bottom:2.5rem;">
          <div style="text-align:center; padding:3rem; color:var(--color-text-subtle);">
            Loading system design blueprints...
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await auth.requireAuth();
      if (!user) return;
      loadSystemDesign();
    });

    async function loadSystemDesign() {
      const container = document.getElementById('systemDesignContainer');
      try {
        const designs = await api.get('/learning/system-design');
        if (!designs || designs.length === 0) {
          container.innerHTML = `<div style="text-align:center;padding:2rem;">No system design blueprints found.</div>`;
          return;
        }

        let html = '';
        designs.forEach(d => {
          let funcHtml = d.requirements.functional.map(f => `<li>✓ ${escapeHtml(f)}</li>`).join('');
          let nonFuncHtml = d.requirements.non_functional.map(nf => `<li>⚡ ${escapeHtml(nf)}</li>`).join('');
          let apisHtml = d.api_design.map(a => `
            <div style="font-family:monospace; font-size:0.8125rem; background:#f8fafc; padding:0.5rem 0.75rem; border-radius:var(--radius-sm); border:1px solid var(--color-border); margin-bottom:0.35rem;">
              <span style="font-weight:700; color:var(--color-primary);">${escapeHtml(a.method)}</span> ${escapeHtml(a.path)} — <span style="color:var(--color-text-muted);">${escapeHtml(a.desc)}</span>
            </div>
          `).join('');

          let questionsHtml = d.interview_questions.map(q => `<li style="margin-bottom:0.35rem;">"${escapeHtml(q)}"</li>`).join('');

          html += `
            <div class="card" style="padding:2rem; border-top:4px solid var(--color-primary);">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
                <div>
                  <span class="badge badge-primary">${escapeHtml(d.difficulty)}</span>
                  <h3 style="font-size:1.45rem; margin-top:0.35rem; color:var(--color-text-main);">${escapeHtml(d.title)}</h3>
                  <p style="font-size:0.9375rem; color:var(--color-text-muted);">${escapeHtml(d.tagline)}</p>
                </div>
              </div>

              <!-- Requirements Grid -->
              <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:1.25rem; margin-bottom:1.5rem; background:var(--color-bg-page); padding:1.25rem; border-radius:var(--radius-md); border:1px solid var(--color-border);">
                <div>
                  <h4 style="font-size:0.9375rem; color:var(--color-text-main); margin-bottom:0.5rem;">Functional Requirements</h4>
                  <ul style="list-style:none; font-size:0.8125rem; color:var(--color-text-muted); display:flex; flex-direction:column; gap:0.35rem;">
                    ${funcHtml}
                  </ul>
                </div>
                <div>
                  <h4 style="font-size:0.9375rem; color:var(--color-text-main); margin-bottom:0.5rem;">Non-Functional Requirements</h4>
                  <ul style="list-style:none; font-size:0.8125rem; color:var(--color-text-muted); display:flex; flex-direction:column; gap:0.35rem;">
                    ${nonFuncHtml}
                  </ul>
                </div>
              </div>

              <!-- High-Level Architecture -->
              <div style="margin-bottom:1.5rem;">
                <h4 style="font-size:1rem; margin-bottom:0.5rem; color:var(--color-text-main);">High-Level Architecture Pipeline</h4>
                <div style="padding:1rem; background:#0f172a; color:#38bdf8; font-family:monospace; font-size:0.875rem; border-radius:var(--radius-md); line-height:1.6;">
                  ${escapeHtml(d.architecture)}
                </div>
              </div>

              <!-- API Endpoints -->
              <div style="margin-bottom:1.5rem;">
                <h4 style="font-size:1rem; margin-bottom:0.5rem; color:var(--color-text-main);">REST API Interface Contracts</h4>
                ${apisHtml}
              </div>

              <!-- Trade-Off Analysis -->
              <div style="padding:1rem 1.25rem; background:#eff6ff; border-left:4px solid var(--color-primary); border-radius:var(--radius-sm); margin-bottom:1.5rem; font-size:0.875rem; line-height:1.6; color:#1e3a8a;">
                <strong>Architectural Trade-Off Analysis:</strong> ${escapeHtml(d.trade_offs)}
              </div>

              <!-- Follow-Up Interview Defense -->
              <div>
                <h4 style="font-size:0.9375rem; margin-bottom:0.5rem; color:var(--color-text-main);">Recruiter Follow-up & Deep-Dive Questions:</h4>
                <ul style="font-size:0.8125rem; color:var(--color-text-muted); padding-left:1.25rem;">
                  ${questionsHtml}
                </ul>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
        if (window.lucide) lucide.createIcons();
      } catch (err) {
        console.error('Failed to load system designs:', err);
        container.innerHTML = `<div style="text-align:center;padding:2rem;color:#ef4444;">Failed to load system design studio.</div>`;
      }
    }
  </script>
</body>
</html>
