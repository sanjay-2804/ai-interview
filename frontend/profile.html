<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile & Preferences — InterviewAI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header id="topbar"></header>

      <main class="page-body">
        
        <div style="margin-bottom: 2rem;">
          <h1 style="font-size: 1.75rem; margin-bottom: 0.25rem;">Student Profile & Placement Settings</h1>
          <p style="color: var(--color-text-muted);">
            Manage your personal academic records, target career focus, and study preferences.
          </p>
        </div>

        <div class="card" style="max-width: 760px; padding: 2rem;">
          <form id="profileForm">
            
            <h3 style="font-size:1.15rem; margin-bottom:1rem; border-bottom:1px solid var(--color-border); padding-bottom:0.5rem;">
              Account & Academic Information
            </h3>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="profName">Full Name</label>
                <input type="text" id="profName" class="form-input" disabled>
                <div class="form-hint">Contact administration to update primary identity.</div>
              </div>

              <div class="form-group">
                <label class="form-label" for="profEmail">Email Address</label>
                <input type="email" id="profEmail" class="form-input" disabled>
              </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="profCollege">College / University</label>
                <input type="text" id="profCollege" class="form-input" placeholder="e.g. National Institute of Technology">
              </div>

              <div class="form-group">
                <label class="form-label" for="profCourse">Course & Branch</label>
                <input type="text" id="profCourse" class="form-input" placeholder="e.g. B.Tech Computer Science">
              </div>
            </div>

            <h3 style="font-size:1.15rem; margin:1.5rem 0 1rem; border-bottom:1px solid var(--color-border); padding-bottom:0.5rem;">
              Placement & Career Targets
            </h3>

            <div class="form-group">
              <label class="form-label" for="profTargetRole">Primary Career Goal</label>
              <select id="profTargetRole" class="form-select">
                <option value="Software Engineer">Software Engineer / Software Developer</option>
                <option value="Java Developer">Java Developer</option>
                <option value="Python Developer">Python Developer</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Full-Stack Developer">Full-Stack Developer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Data Scientist">Data Scientist</option>
                <option value="AI / Machine Learning Engineer">AI / Machine Learning Engineer</option>
                <option value="Cybersecurity Engineer">Cybersecurity Engineer</option>
                <option value="Cloud / DevOps Engineer">Cloud / DevOps Engineer</option>
                <option value="Mobile Developer">Mobile Developer</option>
                <option value="QA / Testing Engineer">QA / Testing Engineer</option>
                <option value="Database Engineer">Database Engineer</option>
                <option value="Other">Other / General Placement</option>
              </select>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.25rem;">
              <div class="form-group">
                <label class="form-label" for="profLang">Preferred Language</label>
                <select id="profLang" class="form-select">
                  <option value="Python">Python</option>
                  <option value="Java">Java</option>
                  <option value="C++">C++</option>
                  <option value="JavaScript">JavaScript</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="profSkill">Current Skill Level</label>
                <select id="profSkill" class="form-select">
                  <option value="Beginner">Beginner</option>
                  <option value="Intermediate">Intermediate</option>
                  <option value="Advanced">Advanced</option>
                </select>
              </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2rem; border-top:1px solid var(--color-border); padding-top:1.5rem;">
              <button type="button" id="profLogoutBtn" class="btn btn-outline" style="color:var(--color-danger); border-color:#fca5a5;">
                <i data-lucide="log-out" style="width:16px;height:16px;"></i> Sign Out of Account
              </button>

              <button type="submit" id="saveProfileBtn" class="btn btn-primary btn-lg">
                <i data-lucide="check" style="width:18px;height:18px;"></i> Save Profile Changes
              </button>
            </div>

          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
