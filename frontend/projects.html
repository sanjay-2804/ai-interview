<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Blueprints — InterviewAI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header id="topbar"></header>

      <main class="page-body">
        
        <div style="margin-bottom: 2rem;">
          <h1 style="font-size: 1.75rem; margin-bottom: 0.25rem;">Curated Industry Project Blueprints</h1>
          <p style="color: var(--color-text-muted);">
            Production-grade project blueprints with system requirements, milestones, database schemas, and expected interview technical defense questions.
          </p>
        </div>

        <div id="projectsGrid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1.5rem;">
          <div style="text-align:center; padding:3rem; color:var(--color-text-subtle);">
            Loading project blueprints...
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
